# Midasbuy — local/dev stack.
#
# PostgreSQL is NOT in here on purpose: it runs on your Windows host, and the
# containers reach it via host.docker.internal (set DB_HOST=host.docker.internal
# in .env). `extra_hosts` makes that name resolve on Linux servers too, so the
# same compose file works in production.
#
# First run:
#   docker compose build
#   docker compose run --rm web python manage.py migrate   # one-off, before `up`
#   docker compose up -d
#
# Day-to-day (containers already running via `up`):
#   docker compose exec web python manage.py migrate       # reuse the running web
#   docker compose exec web python manage.py createsuperuser
#
# `run --rm` = spin up a brand-new throwaway container for one command (works
#               even when nothing is `up`; --rm deletes it afterwards).
# `exec`      = run the command INSIDE the already-running container (needs `up`
#               first; faster, shares that container's state).
#
# Log an account in (needs the browser -> the WORKER, with a virtual display):
#   docker compose exec worker xvfb-run -a python manage.py login_account 1
#
services:
  redis:
    image: redis:7-alpine
    container_name: midasbuy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile            # FastAPI + Django ASGI + Chromium
    container_name: midasbuy_web
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0  # talk to the redis service, not localhost
    volumes:
      - .:/app                          # live code reload in dev
      - ./midasbuy_sessions:/app/midasbuy_sessions
    ports:
      - "8000:8000"
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The image entrypoint starts the virtual X display; just run the server here.
    command: uvicorn midasbuy_project.asgi:application --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker     # Celery + Chromium
    image: midasbuy_worker
    container_name: midasbuy_worker
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - ./midasbuy_sessions:/app/midasbuy_sessions
      - /dev/shm:/dev/shm               # Chromium needs a big /dev/shm
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The image entrypoint starts the virtual X display; just run celery here.
    command: celery -A midasbuy_project worker -l info --concurrency=2

  # Celery beat — fires the periodic schedule (e.g. account re-login every 12h).
  # It only ENQUEUES tasks; the worker above runs them (and has the browser).
  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: midasbuy_worker
    container_name: midasbuy_beat
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A midasbuy_project beat -l info
