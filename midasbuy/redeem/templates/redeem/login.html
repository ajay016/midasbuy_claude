{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Midasbuy Panel</title>
    <link rel="stylesheet" href="{% static 'panel/theme.css' %}" />
    <style> body { justify-content: center; } </style>
</head>
<body>
    <div class="card auth">
        <div class="logo">
            <div class="badge">
                <svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4Z"/></svg>
                <span>MIDASBUY PANEL</span>
            </div>
        </div>
        <h1>Sign in</h1>
        <p class="subtitle">Merchant access only</p>

        {% if error %}<div class="form-error">{{ error }}</div>{% endif %}

        <form method="post" action="{% url 'panel_login' %}">
            {% csrf_token %}
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="username" required />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;padding:13px;font-size:15px;">Sign in</button>
        </form>
    </div>
</body>
</html>
